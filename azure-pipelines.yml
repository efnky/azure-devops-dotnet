# Azure DevOps Pipeline — builds & publishes the .NET app, then
# exposes the published output as a pipeline artifact for komuta to consume.
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetSdkVersion: 9.0.301          # matches global.json

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK $(dotnetSdkVersion)
    inputs:
      packageType: sdk
      version: $(dotnetSdkVersion)

  - script: dotnet restore
    displayName: Restore

  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: Build

  - script: >
      dotnet publish
      --configuration $(buildConfiguration)
      --no-restore
      --output $(Build.ArtifactStagingDirectory)/publish
    displayName: Publish

  - task: PublishPipelineArtifact@1
    displayName: Publish pipeline artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/publish
      artifactName: azure-devops-dotnet
